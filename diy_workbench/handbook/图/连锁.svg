<svg xmlns="http://www.w3.org/2000/svg" width="740" height="286" viewBox="0 0 740 286"><rect width="740" height="286" rx="12" fill="#f3f7f9"/><g font-family="Microsoft YaHei, sans-serif"><text x="22" y="35" font-size="23" fill="#15374a" font-weight="bold" text-anchor="start">先发动的效果，留到后面处理</text><rect x="20" y="62" width="331" height="70" fill="#e5eef8" stroke="#315f7c" rx="7"/><text x="185.5" y="93" font-size="19" fill="#315f7c" font-weight="bold" text-anchor="middle">连锁 1　发动破坏效果</text><text x="185.5" y="116" font-size="15" fill="#304b57" font-weight="normal" text-anchor="middle">付 500 基本分，选怪兽甲为对象</text><rect x="390" y="62" width="329" height="70" fill="#f8eedf" stroke="#855e29" rx="7"/><text x="554.5" y="93" font-size="19" fill="#855e29" font-weight="bold" text-anchor="middle">连锁 2　对方回应</text><text x="554.5" y="116" font-size="15" fill="#304b57" font-weight="normal" text-anchor="middle">让怪兽甲回到手卡</text><text x="358" y="103" font-size="22" fill="#21374a" font-weight="normal" text-anchor="start">→</text><text x="534" y="155" font-size="22" fill="#21374a" font-weight="normal" text-anchor="start">↓</text><rect x="390" y="167" width="329" height="66" fill="#f8eedf" stroke="#855e29" rx="7"/><text x="554.5" y="196" font-size="19" fill="#855e29" font-weight="bold" text-anchor="middle">先处理连锁 2</text><text x="554.5" y="218" font-size="15" fill="#304b57" font-weight="normal" text-anchor="middle">甲离开场上</text><rect x="20" y="167" width="331" height="66" fill="#e5eef8" stroke="#315f7c" rx="7"/><text x="185.5" y="196" font-size="19" fill="#315f7c" font-weight="bold" text-anchor="middle">再处理连锁 1</text><text x="185.5" y="218" font-size="15" fill="#304b57" font-weight="normal" text-anchor="middle">原目标已离场，无法破坏它</text><text x="359" y="207" font-size="22" fill="#21374a" font-weight="normal" text-anchor="start">←</text><text x="22" y="268" font-size="16" fill="#21374a" font-weight="normal" text-anchor="start">已经支付的 500 基本分仍然扣除。发动前本来就没有目标，则不能发动。</text></g></svg>
