<svg xmlns="http://www.w3.org/2000/svg" width="740" height="287" viewBox="0 0 740 287"><rect width="740" height="287" rx="12" fill="#f3f7f9"/><g font-family="Microsoft YaHei, sans-serif"><text x="22" y="35" font-size="23" fill="#15374a" font-weight="bold" text-anchor="start">一个回合怎样走</text><rect x="19" y="61" width="217" height="60" fill="#e4eef6" stroke="#315f7c" rx="7"/><text x="127.5" y="88" font-size="19" fill="#315f7c" font-weight="bold" text-anchor="middle">1  抽卡阶段</text><text x="127.5" y="107" font-size="15" fill="#304b57" font-weight="normal" text-anchor="middle">通常抽 1 张</text><text x="240" y="98" font-size="18" fill="#21374a" font-weight="normal" text-anchor="start">→</text><rect x="261" y="61" width="217" height="60" fill="#e4eef6" stroke="#315f7c" rx="7"/><text x="369.5" y="88" font-size="19" fill="#315f7c" font-weight="bold" text-anchor="middle">2  准备阶段</text><text x="369.5" y="107" font-size="15" fill="#304b57" font-weight="normal" text-anchor="middle">阶段效果</text><text x="482" y="98" font-size="18" fill="#21374a" font-weight="normal" text-anchor="start">→</text><rect x="503" y="61" width="217" height="60" fill="#e4eef6" stroke="#315f7c" rx="7"/><text x="611.5" y="88" font-size="19" fill="#315f7c" font-weight="bold" text-anchor="middle">3  主要阶段 1</text><text x="611.5" y="107" font-size="15" fill="#304b57" font-weight="normal" text-anchor="middle">召唤与发动</text><rect x="19" y="143" width="217" height="60" fill="#e4f1ec" stroke="#326d5a" rx="7"/><text x="127.5" y="170" font-size="19" fill="#326d5a" font-weight="bold" text-anchor="middle">4  战斗阶段</text><text x="127.5" y="189" font-size="15" fill="#304b57" font-weight="normal" text-anchor="middle">攻击与计算</text><text x="240" y="180" font-size="18" fill="#21374a" font-weight="normal" text-anchor="start">→</text><rect x="261" y="143" width="217" height="60" fill="#e4f1ec" stroke="#326d5a" rx="7"/><text x="369.5" y="170" font-size="19" fill="#326d5a" font-weight="bold" text-anchor="middle">5  主要阶段 2</text><text x="369.5" y="189" font-size="15" fill="#304b57" font-weight="normal" text-anchor="middle">战斗后行动</text><text x="482" y="180" font-size="18" fill="#21374a" font-weight="normal" text-anchor="start">→</text><rect x="503" y="143" width="217" height="60" fill="#e4f1ec" stroke="#326d5a" rx="7"/><text x="611.5" y="170" font-size="19" fill="#326d5a" font-weight="bold" text-anchor="middle">6  结束阶段</text><text x="611.5" y="189" font-size="15" fill="#304b57" font-weight="normal" text-anchor="middle">处理到期效果</text><text x="21" y="240" font-size="17" fill="#21374a" font-weight="normal" text-anchor="start">先攻第一回合不进行通常抽卡，也不能进入战斗阶段。</text><text x="21" y="269" font-size="17" fill="#21374a" font-weight="normal" text-anchor="start">选择不进入战斗阶段时，从主要阶段 1 直接进入结束阶段。</text></g></svg>
