<svg xmlns="http://www.w3.org/2000/svg" width="740" height="310" viewBox="0 0 740 310"><rect width="740" height="310" rx="12" fill="#f3f7f9"/><g font-family="Microsoft YaHei, sans-serif"><text x="22" y="35" font-size="23" fill="#15374a" font-weight="bold" text-anchor="start">同一组素材，两种出场方法</text><rect x="20" y="65" width="320" height="65" fill="#e4f0ea" stroke="#316954" rx="7"/><text x="180" y="94" font-size="19" fill="#316954" font-weight="bold" text-anchor="middle">等级 4　调整</text><text x="180" y="115" font-size="15" fill="#304b57" font-weight="normal" text-anchor="middle">表侧在自己场上</text><rect x="399" y="65" width="320" height="65" fill="#e4f0ea" stroke="#316954" rx="7"/><text x="559" y="94" font-size="19" fill="#316954" font-weight="bold" text-anchor="middle">等级 4　非调整</text><text x="559" y="115" font-size="15" fill="#304b57" font-weight="normal" text-anchor="middle">表侧在自己场上</text><text x="357" y="105" font-size="27" fill="#21374a" font-weight="normal" text-anchor="start">＋</text><line x1="370" y1="140" x2="370" y2="156" stroke="#47768b" stroke-width="2"/><line x1="185" y1="156" x2="555" y2="156" stroke="#47768b" stroke-width="2"/><line x1="185" y1="156" x2="185" y2="174" stroke="#47768b" stroke-width="2"/><line x1="555" y1="156" x2="555" y2="174" stroke="#47768b" stroke-width="2"/><rect x="20" y="179" width="330" height="80" fill="#e5eaf7" stroke="#485c91" rx="7"/><text x="185" y="215" font-size="19" fill="#485c91" font-weight="bold" text-anchor="middle">同调　4 ＋ 4 ＝ 等级 8</text><text x="185" y="241" font-size="15" fill="#304b57" font-weight="normal" text-anchor="middle">两只素材通常送去墓地</text><rect x="390" y="179" width="329" height="80" fill="#efe8f2" stroke="#765782" rx="7"/><text x="554.5" y="215" font-size="19" fill="#765782" font-weight="bold" text-anchor="middle">超量　两个等级 4</text><text x="554.5" y="241" font-size="15" fill="#304b57" font-weight="normal" text-anchor="middle">素材重叠在阶级 4 怪兽下</text><text x="22" y="291" font-size="16" fill="#21374a" font-weight="normal" text-anchor="start">还要满足目标怪兽写明的种族、数量等素材要求，并有合法放置格。</text></g></svg>
