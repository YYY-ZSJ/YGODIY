<svg xmlns="http://www.w3.org/2000/svg" width="740" height="212" viewBox="0 0 740 212"><rect width="740" height="212" rx="12" fill="#f3f7f9"/><g font-family="Microsoft YaHei, sans-serif"><text x="22" y="35" font-size="23" fill="#15374a" font-weight="bold" text-anchor="start">把一组卡变成一个条件</text><rect x="20" y="70" width="200" height="78" fill="#faebe2" stroke="#9a5632" rx="7"/><text x="120" y="105" font-size="19" fill="#9a5632" font-weight="bold" text-anchor="middle">全部</text><text x="120" y="130" font-size="15" fill="#304b57" font-weight="normal" text-anchor="middle">自己怪兽区的龙族</text><text x="227" y="114" font-size="23" fill="#21374a" font-weight="normal" text-anchor="start">→</text><rect x="263" y="70" width="203" height="78" fill="#f8efdf" stroke="#91621f" rx="7"/><text x="364.5" y="105" font-size="19" fill="#91621f" font-weight="bold" text-anchor="middle">卡的数量</text><text x="364.5" y="130" font-size="15" fill="#304b57" font-weight="normal" text-anchor="middle">2 张 → 数字 2</text><text x="475" y="114" font-size="23" fill="#21374a" font-weight="normal" text-anchor="start">→</text><rect x="510" y="70" width="210" height="78" fill="#e4eef8" stroke="#315f7c" rx="7"/><text x="615" y="105" font-size="19" fill="#315f7c" font-weight="bold" text-anchor="middle">比较　≥ 2</text><text x="615" y="130" font-size="15" fill="#304b57" font-weight="normal" text-anchor="middle">成立 → 可以发动</text><text x="22" y="191" font-size="17" fill="#21374a" font-weight="normal" text-anchor="start">输入是卡片组，点数后得到数字，比较之后才得到“是”或“否”。</text></g></svg>
